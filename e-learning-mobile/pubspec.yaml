name: e_learning_mobile
description: Application mobile Flutter e-learning (parcours apprenant v0).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  video_player: ^2.14.0
  chewie: ^1.15.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_markdown_plus: ^1.0.12
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  # Doit rester aligné sur la contrainte de flutter_localizations (^0.20.3).
  intl: ^0.20.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    # `flutter_dotenv` lit le fichier via le bundle : sans cette déclaration,
    # `.env` est absent du build et la configuration retombe sur la valeur par
    # défaut. Le fichier doit exister à la racine (`cp .env.template .env`).
    - .env
  fonts:
    # Inter est embarqué (et non chargé via `google_fonts`) pour rester lisible
    # hors ligne : l'app doit fonctionner sans réseau. Licence OFL dans
    # `assets/fonts/Inter-LICENSE.txt`.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
