[project]
name = "e-learning-api"
version = "0.2.0"
description = "API e-learning — architecture hexagonale, DDD (SQLAlchemy async, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aio-pika>=9.5.0",
    "alembic>=1.19.0",
    "asyncpg>=0.31",
    "click>=8.4.2",
    "fastapi>=0.140.0",
    "ffmpeg-python>=0.2.0",
    "hypercorn>=0.18.0",
    "orjson>=3.10.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
ai = [
    "openai>=2.53.0",
    "openai-whisper>=20250625",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.0,<1.20",
    "sentence-transformers>=5.0.0",
]
dev = [
    "db2md[postgres]>=0.1.0",
    "httpx>=0.28.1",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e_learning"]

[project.scripts]
e-learning-cli = "e_learning.presentation.cli.app:main"
e-learning-api = "e_learning.main:run"
e-learning-worker = "e_learning.presentation.worker:run"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["e_learning"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "e_learning"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Architecture hexagonale (dépendances vers l'intérieur)"
type = "layers"
layers = [
    "e_learning.presentation",
    "e_learning.infrastructure",
    "e_learning.application",
    "e_learning.domain",
]

[[tool.importlinter.contracts]]
name = "Domaine sans framework"
type = "forbidden"
source_modules = ["e_learning.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "starlette",
]
